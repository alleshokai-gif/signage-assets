<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Signage Portal</title>
  <script src="assets/version.js?v=2026.10.22.0742"></script>
  <script>
    (() => {
      const version = window.APP_VERSION || "dev";
      const url = new URL(location.href);
      if (url.searchParams.get("v") !== version) {
        url.searchParams.set("v", version);
        location.replace(url.toString());
      }
    })();
  </script>
  <style>
    :root{
      --menu-h: 150px;            /* アイコンでかめ */
      --menu-gap: 22px;
      --menu-pad: 18px;
      --menu-radius: 26px;
      --menu-bg: rgba(0,0,0,.22);
      --menu-border: rgba(255,255,255,.20);

      --icon-size: 108px;         /* ← ここで大きさ調整 */
      --icon-ring: rgba(255,255,255,.35);
      --icon-ring-active: rgba(255,255,255,.75);

      --shadow: 0 10px 24px rgba(0,0,0,.45);
    }

    html, body { height:100%; margin:0; background:#000; overflow:hidden; }

    /* iframeは全画面固定（Lookerは常にフル） */
    .view {
      position:absolute; inset:0;
      width:100vw; height:100vh;
      border:0;
      z-index: 10;
      opacity:0;
      pointer-events:none;
      transition: opacity 180ms linear;
      background:#000;
    }
    .view.active { opacity:1; pointer-events:auto; }

    body.contentFrameActive .view {
      z-index: 130;
    }

    #topMask{
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 6px;          /* まず6pxで。消えたら3pxに下げる */
      background: #000;
      z-index: 9999;
      pointer-events: none;
    }

    .rtClock{
      position: fixed;
      top: 18px;
      left: 0; right: 0;
      display: none;
      z-index: 120;
      pointer-events: none;
      text-align: center;
      color: rgba(255,255,255,.92);
      text-shadow: 0 6px 18px rgba(0,0,0,.55);
      letter-spacing: .04em;
      white-space: nowrap;
    }

    .rtClockTapTarget{
      display: inline-flex;
      align-items: baseline;
      border: 0;
      padding: 0;
      margin: 0;
      background: transparent;
      color: inherit;
      text-shadow: inherit;
      letter-spacing: inherit;
      white-space: inherit;
      cursor: pointer;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
    }

    .clockVoiceMenu{
      position: fixed;
      top: 124px;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: min(360px, 82vw);
      padding: 12px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 18px;
      background: rgba(15,15,15,.92);
      box-shadow: 0 18px 40px rgba(0,0,0,.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms linear, transform 160ms ease;
    }

    .clockVoiceMenu.show{
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .clockVoiceMenu button{
      min-height: 54px;
      border: 0;
      border-radius: 12px;
      background: rgba(255,255,255,.10);
      color: rgba(255,255,255,.94);
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .clockVoiceMenu button:active{
      transform: scale(0.98);
      background: rgba(255,255,255,.16);
    }

    /* 日付：1.5倍 */
    .rtDate{
      font-size: 84px;      /* ←ここが日付サイズ */
      font-weight: 500;
    }

    /* 曜日：今のサイズ感に合わせる（小さめ固定） */
    .rtDow{
      font-size: 56px;      /* ←（金）のサイズ */
      margin: 0 18px;
      font-weight: 500;
    }

    /* 時刻：1.5倍 */
    .rtTime{
      display: inline-flex;
      align-items: flex-start;
    }

    .rtHM{
      font-size: 84px;      /* ←ここが時刻(HH:MM)サイズ */
      font-weight: 500;
    }

    /* 秒：右下に小さめ */
    .rtSec{
      font-size: 42px;      /* ←時刻の半分くらい */
      margin-left: 10px;
      margin-top: 34px;     /* ←下げ具合（好みで微調整） */
      opacity: .92;
      letter-spacing: .06em;
    }

    /* メニュー：下に重ねる（画面分割しない） */
    #menuWrap {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      height: var(--menu-h);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index: 160;
      pointer-events: auto;
    
      transition: transform 420ms cubic-bezier(.22,.9,.2,1),
                  opacity   420ms cubic-bezier(.22,.9,.2,1);
    }
    
    #menuWrap.hidden{
      transform: translateY(110%);
      opacity: 0;
      pointer-events: none;
    }
    /* メニュー呼び出し“にゅ！”ゾーン（下端の透明バー） */
    #menuHandle{
      position: fixed;
      left: 0; right: 0; bottom: 0;
      height: 24px;            /* 18〜28で好み */
      z-index: 165;             /* menuWrapより上でOK */
      background: transparent; /* 見えない */
      pointer-events: none;    /* 普段は無効（immersive時だけ有効化） */
    }

    /* メニューパネル（半透明の台座） */
    #menu{
      pointer-events: auto;
      display:flex;
      gap: var(--menu-gap);
      padding: 0;                 /* 台座いらん */
      background: transparent;    /* 透明 */
      border: 0;                  /* 枠なし */
      border-radius: 0;
      box-shadow: none;           /* 影なし */
      backdrop-filter: none;      /* ぼかしなし */
    }

    /* ボタン（ファンシーアイコン想定） */
    .mBtn{
      pointer-events: auto;       /* ←ここだけクリック有効 */
      width: var(--icon-size);
      height: var(--icon-size);
      border: 0;
      padding: 0;
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
      position: relative;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transform: translateZ(0);
    }

    /* アイコン画像（PNG/WebP/SVG） */
    .mBtn img{
      width: 100%;
      height: 100%;
      display:block;
      border-radius: 999px;
      box-shadow: 0 8px 18px rgba(0,0,0,.35);
    }

    /* 輪っか（アクティブが分かりやすい） */
    .mBtn::after{
      content:'';
      position:absolute; inset:-6px;
      border-radius:999px;
      border: 3px solid var(--icon-ring);
      opacity: .9;
      transition: 140ms;
    }
    .mBtn.active::after{
      border-color: var(--icon-ring-active);
      box-shadow: 0 0 0 6px rgba(255,255,255,.10);
    }

    /* 押したときの気持ちよさ */
    .mBtn:active { transform: scale(0.96); }

    /* 左上デバッグ（任意） */
    #toast{
      position: fixed;
      left: 10px; top: 10px;
      z-index: 60;
      font-size: 12px;
      color: rgba(255,255,255,.85);
      background: transparent;  /* ← 黒箱消す */
      border: 0;                /* ← 枠消す */
      padding: 0;               /* ← 余白消す */
      border-radius: 0;
      pointer-events:none;
    }

    .adminGearButton{
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 180;
      width: 42px;
      height: 42px;
      min-width: 42px;
      min-height: 42px;
      padding: 0;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 999px;
      background: rgba(0,0,0,.34);
      color: rgba(255,255,255,.92);
      font-size: 22px;
      line-height: 1;
      box-shadow: 0 8px 18px rgba(0,0,0,.35);
      cursor: pointer;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
    }

    .adminGearButton:active{
      transform: scale(0.96);
      background: rgba(255,255,255,.16);
    }

    .adminGearButton.hidden{
      display: none;
      pointer-events: none;
    }

    .subModal{
      position:fixed; inset:0;
      display:none;
      z-index: 240;
      background: rgba(0,0,0,.55);
      align-items:center;
      justify-content:center;
      pointer-events: none;
    }
    .subModal.show{ display:flex; pointer-events: auto; }
    
    .subPanel{
      width: min(640px, 92vw);
      border-radius: 28px;
      background: rgba(15,15,15,.92);
      box-shadow: 0 18px 40px rgba(0,0,0,.55);
      border: 1px solid rgba(255,255,255,.10);
      padding: 18px 18px 22px;
    }
    
    .subHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom: 14px;
    }
    .subTitle{
      font-size: 34px;
      font-weight: 600;
      color: rgba(255,255,255,.92);
      letter-spacing:.04em;
    }
    .subClose{
      width:64px; height:64px;
      border-radius: 18px;
      border: 0;
      font-size: 44px;
      line-height: 1;
      background: rgba(255,255,255,.10);
      color: rgba(255,255,255,.92);
    }
    
    /* ===== 子メニュー：タイル（アプリ一覧） ===== */
    .subGrid{
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* 3列が一番OSっぽい */
      gap: 26px;
    }
    
    /* タイル本体：正方形固定 */
    .subItem{
      aspect-ratio: 1 / 1;
      width: 100%;
      border: 0;
      border-radius: 28px;
    
      background: rgba(255,255,255,.10);
      box-shadow: 0 10px 24px rgba(0,0,0,.35);
    
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transform: translateZ(0);
    }
    
    /* 押したとき */
    .subItem:active{
      transform: scale(0.97);
      background: rgba(255,255,255,.15);
    }
    
    /* アイコン：タイルの主役 */
    .subIconImg{
      width: 65%;
      height: 65%;
      border-radius: 22px;
      object-fit: cover;
      display: block;
    }
    
    /* ラベル：短く太く */
    .subLabel{
      font-size: 20px;
      font-weight: 700;
      line-height: 1.1;
      text-align: center;
      color: rgba(255,255,255,.95);
      text-shadow: 0 6px 18px rgba(0,0,0,.35);
    }
    
    .subIcon{
      font-size: 44px;
    }

    .subItem:active{ transform: scale(0.98); }
    .subItem:active .subIconWrap{
      background: rgba(255,255,255,.22);
      transform: scale(0.97);
    }
    
    /* 画面が小さいときは自動で縮める（保険） */
    @media (max-width: 900px){
      :root{ --icon-size: 92px; --menu-h: 135px; --menu-gap: 16px; }
    }
    @media (max-width: 720px){
      :root{ --icon-size: 82px; --menu-h: 125px; --menu-gap: 12px; }
    }

    .appVersion{
      position: fixed;
      right: 8px;
      bottom: 6px;
      font-size: 10px;
      opacity: 0.5;
      z-index: 9999;
      color: #fff;
      pointer-events: none;
    }
  
.radioQueue1830Diagnostic{
  position:fixed;top:68px;right:12px;z-index:180;

}
.radioQueue1830Diagnostic output[hidden]{display:none!important}

</style>

<script>
  let __castReady = false;
  let __castReadyResolver = null;

  const __castReadyPromise = new Promise((resolve) => {
    __castReadyResolver = resolve;
  });

  function enableCastButton_() {
    const btn = document.getElementById("castTestBtn");
    if (btn) btn.disabled = false;
  }

  function disableCastButton_() {
    const btn = document.getElementById("castTestBtn");
    if (btn) btn.disabled = true;
  }

  disableCastButton_();

  window.__onGCastApiAvailable = function(isAvailable) {
    if (!isAvailable) {
      console.log("[CAST] API not available");
      return;
    }

    try {
      const context = cast.framework.CastContext.getInstance();
      context.setOptions({
        receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
        autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
      });

      __castReady = true;
      __castReadyResolver?.(true);
      enableCastButton_();

      console.log("[CAST] ready");
    } catch (e) {
      console.error("[CAST] init failed", e);
    }
  };

  async function waitForCastReady_() {
    if (__castReady) return true;
    return await __castReadyPromise;
  }

  window.castAudioUrl_ = async function(url, title = "Signage Test", mimeType = "audio/mpeg") {
    if (!url) throw new Error("Cast URL is empty");

    await waitForCastReady_();

    const context = cast.framework.CastContext.getInstance();
    let session = context.getCurrentSession();

    if (!session) {
      await context.requestSession();
      session = context.getCurrentSession();
    }

    if (!session) {
      throw new Error("Cast session not established");
    }

    const mediaInfo = new chrome.cast.media.MediaInfo(url, mimeType);
    const metadata = new chrome.cast.media.GenericMediaMetadata();
    metadata.title = title;
    mediaInfo.metadata = metadata;

    const request = new chrome.cast.media.LoadRequest(mediaInfo);
    request.autoplay = true;

    await new Promise((resolve, reject) => {
      session.loadMedia(
        request,
        () => {
          console.log("[CAST] PLAY", { url, title });
          resolve(true);
        },
        (err) => reject(err)
      );
    });
  };

  document.getElementById("castTestBtn")?.addEventListener("click", async () => {
    const url = "https://alleshokai-gif.github.io/signage-assets/assets/voice/test.mp3";

    try {
      await castAudioUrl_(url, "Signage Test", "audio/mpeg");
    } catch (e) {
      console.error("[CAST TEST FAIL]", e);
      alert(e?.message || e);
    }
  });
</script>

async function playTtsBase64(base64,onEvent){
      const audio = new Audio("data:audio/mpeg;base64," + base64);
      audio.volume = 1.0;

      return new Promise(resolve=>{
        let settled = false;
        let started=false;
        const notify=event=>{try{onEvent&&onEvent(event);}catch(_){}};
        const finish = event => {
          if (settled) return;
          settled = true;
          audio.onplay=null;
          notify(event);

          audio.onerror = null;
          resolve(event);

        audio.onplay=()=>{if(!started){started=true;notify('play-start');}};
        audio.onended = () => finish('ended');
        audio.onerror = () => finish('error');

        try{
          const playResult = audio.play();
          if (playResult && typeof playResult.catch === 'function') {
            playResult.catch(() => finish('play-rejected'));
          }
        }catch(_){
          finish('play-threw');
        }
      });
    }

function createLocalClock1830TestHandler_(button,output,requestRadioItems){
  const usedKey='signage.radio.nightReplayOneShot.v1';
  const lockName='signage.radio.nightReplayOneShot.v1';
  let attempted=false;
  return async function(event){
    event?.preventDefault?.();
    event?.stopPropagation?.();
    if(attempted)return null;
    let oneShotConsumed=false;
    output.hidden=false;
    output.textContent='夜の本編を再生します。音声が鳴ります。';
    try{
      if(SignageBoundary.credentialStatus()!=='saved'){
        output.textContent='認証未設定のため再生しません。';
        return null;
      }
      if(!navigator?.locks||typeof navigator.locks.request!=='function'){
        output.textContent='一回制御が使えないため再生しません。';
        return null;
      }
      attempted=true;
      button.disabled=true;
      button.setAttribute('aria-busy','true');
      const result=await navigator.locks.request(lockName,{mode:'exclusive',ifAvailable:true},async lock=>{
        if(!lock){
          attempted=false;
          button.disabled=false;
          output.textContent='別の試験が実行中です。二重再生しません。';
          return null;
        }
        if(localStorage.getItem(usedKey)){
          oneShotConsumed=true;
          output.textContent='この端末では一回再生済みです。';
          return null;
        }
        localStorage.setItem(usedKey,'started');
        if(localStorage.getItem(usedKey)!=='started')throw Error('one-shot marker did not persist');
        oneShotConsumed=true;
        output.textContent='夜の本編を再生中です。音声が鳴ります。';
        return await requestRadioItems('clock_1830');
      });
      if(result)output.textContent=localClock1830TestResultText_(result);
      return result;
    }catch(_){
      if(!oneShotConsumed){attempted=false;button.disabled=false;}
      output.textContent='一回再生を開始または完了できませんでした。詳細は表示しません。';
      return null;
    }finally{
      button.setAttribute('aria-busy','false');
    }
  };
}
function bindLocalClock1830Test_(button,output,requestRadioItems){
  if(!button||!output)return false;
  button.addEventListener('click',createLocalClock1830TestHandler_(button,output,requestRadioItems));
  return true;

    function reasonByHm_(hm){
      switch(hm){
        case '06:35': return 'cast_wakeup';
        case '06:55': return 'clock_0655';
        case '07:20': return 'clock_0720';
        case '07:40': return 'clock_0740';

        case '21:00': return 'clock_2100';
        case '21:30': return 'cast_sleep';
        default:      return 'clock';

    }

    function ymdLocal_(d){
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${day}`;
    }

    let __clockInFlight = false;
    let __lastLoggedHM = '';
    let __lastStartedKey = '';

    async function tickClockVoice(){
      const now = new Date();
      const hh = String(now.getHours()).padStart(2,'0');
      const mm = String(now.getMinutes()).padStart(2,'0');
      const hm = `${hh}:${mm}`;

      const el = document.getElementById('clockDebug');
      if (el) {
        const next = nextSpeakHm_(hm);
        el.textContent = `clock:${hm} (${now.toLocaleTimeString()}) next:${next}`;
      }

      // ★同じ分は1回だけ（同一ループ内の多重呼び出し対策）
      if (hm !== __lastLoggedHM) {
        __lastLoggedHM = hm;
        console.log('[tickClockVoice]', { now: now.toString(), hm });
      }

      // ★対象時刻以外は無視
      if (!CLOCK_SPEAK_TIMES.includes(hm)) return;

      // ★追加：直近発火クールダウン（例：45秒）
      const cooldownMs = 45 * 1000;
      const last = Number(localStorage.getItem('CLOCK_LAST_FIRE_MS') || 0);
      const diff = Date.now() - last;
      if (diff >= 0 && diff < cooldownMs) {
        console.log('[tickClockVoice] skipped by cooldown', { hm, diff });
        return;
      }

      const day = ymdLocal_(now);
      const key = `${CLOCK_KEY_PREFIX}${day}_${hm}`;
      const attemptKey = `clockAttempted_${day}_${hm}`;
      const playedKey = `clockPlayed_${day}_${hm}`;
      const reason = reasonByHm_(hm);
      const isWeekstart0740 = reason === 'clock_0740';

      if (__clockInFlight) return;
      if (__lastStartedKey === key) return;
      const previousAttempt = Number(localStorage.getItem(attemptKey) || 0);
      if (previousAttempt > 0 && Date.now() - previousAttempt < 15000) return;

      // ★同一日・同一時刻は1回だけ（端末の再読込や二重起動対策）
      if (isWeekstart0740 && localStorage.getItem(playedKey)) {
        console.log('[tickClockVoice] skipped by played localStorage', playedKey);
        return;
      }
      if (!isWeekstart0740 && localStorage.getItem(key)) {
        console.log('[tickClockVoice] skipped by localStorage', key);
        return;
      }

      const castOnlyReasons = ['cast_wakeup', 'cast_sleep'];

      // Cast has no radio playback result; preserve its one-shot behavior.
      if (castOnlyReasons.includes(reason)) {
        localStorage.setItem(key, '1');
        localStorage.setItem('CLOCK_LAST_FIRE_MS', String(Date.now()));
        requestCastIfNeeded_(reason);
        return;
      }

      // A failed attempt with no playback can retry within this minute. Keep
      // an in-memory guard so the five-second clock loop cannot overlap runs.
      __clockInFlight = true;
      localStorage.setItem(attemptKey, String(Date.now()));
      try {
        const playOnce = async () => {
          // Another tab may have finished while this tab waited for the lock.
          if (localStorage.getItem(key) || (isWeekstart0740 && localStorage.getItem(playedKey))) return;
          const markStarted = () => {
            if (__lastStartedKey === key) return;
            __lastStartedKey = key;
            localStorage.setItem(key, '1');
            localStorage.setItem('CLOCK_LAST_FIRE_MS', String(Date.now()));
            if (isWeekstart0740) localStorage.setItem(playedKey, String(Date.now()));
          };
          const radioResult = await requestRadioItems(reason, {}, markStarted);
          if (radioResult?.startedItemCount > 0) {
            markStarted();
          } else {
            console.warn('[clock radio not started]', {reason,
              requestOutcome:radioResult?.requestOutcome || 'unknown',
              source:radioResult?.source || 'unknown'});
          }
        };
        if (typeof navigator !== 'undefined' && navigator.locks?.request) {
          await navigator.locks.request('signage.clock.' + day + '_' + hm,
            {mode:'exclusive',ifAvailable:true}, async lock => { if (lock) await playOnce(); });
        } else await playOnce();
      } catch (_) {
        console.warn('[clock radio failed before playback]', reason);
      } finally {
        __clockInFlight = false;
      }
    }

    console.log('[BOOT] start clock loop', new Date().toString());
    setInterval(tickClockVoice, 5 * 1000); // ★15秒→5秒推奨（分変化ガードあるから軽い）
    tickClockVoice(); // ★起動直後に1回

    async function tickAlertCheck(){
      const result = await requestRadioItems('alert_check', { device: ALERT_DEVICE_ID });
      console.log('[ALERT CHECK]', {
        device: ALERT_DEVICE_ID,
        ok: result?.ok ?? null,

        matched: result?.debug?.matched ?? null,
        itemsLength: result?.itemsLength ?? 0,
        debug: result?.debug ?? null
      });
    }

    if (ALERT_CHECK_ENABLED) {
      console.log('[BOOT] start alert_check loop', { device: ALERT_DEVICE_ID, now: new Date().toString() });
      setInterval(tickAlertCheck, 30 * 1000);
      tickAlertCheck();
    } else {
      console.log('[BOOT] alert_check disabled on this device', { device: ALERT_DEVICE_ID });
    }

    function nextSpeakHm_(hmNow){
      const times = CLOCK_SPEAK_TIMES.slice().sort(); // "06:55"みたいな文字列想定
      for (const t of times) if (t > hmNow) return t;
      return times[0] || '-';
    }

    // ===== SFX (Web Audio) =====
    let _ac = null;

    function sfxUnlock(){
      if (_ac) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      _ac = new AC();

      // unlock用に無音を一瞬鳴らす（端末によって必要）
      const o = _ac.createOscillator();
      const g = _ac.createGain();
      g.gain.value = 0.0001;
      o.connect(g).connect(_ac.destination);
      o.start();
      o.stop(_ac.currentTime + 0.02);
    }

    function sfxTone(freq=440, ms=80, type='sine', vol=0.12){
      if (!_ac) return;
      const t0 = _ac.currentTime;
      const o = _ac.createOscillator();
      const g = _ac.createGain();

      o.type = type;
      o.frequency.setValueAtTime(freq, t0);

      // クリック音防止のエンベロープ
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + ms/1000);

      o.connect(g).connect(_ac.destination);
      o.start(t0);
      o.stop(t0 + ms/1000 + 0.02);
    }

    // ===== tts Test (voice of Shimao and Peno) =====
    document.getElementById('radioMorningTestBtn')?.addEventListener('pointerdown', async (e) => {
      e.preventDefault();
      e.stopPropagation();
      await requestRadioItems('clock_0720');
    }, true);

    document.getElementById('ttsSpeakerTestBtn')?.addEventListener('pointerdown',(e)=>{e.preventDefault();e.stopPropagation();setToast?.('個別音声テストは利用できません。ラジオ再生を使ってください。');},true);
    // 使いやすいプリセット
    function sfxMenu(){      sfxTone(880, 35, 'square', 0.06); }      // ピッ
    function sfxCorrect(){   sfxTone(784, 60,'sine', 0.10); setTimeout(()=>sfxTone(1046, 80,'sine',0.12), 70); } // ポーン
    function sfxWrong(){     sfxTone(160,120,'sawtooth',0.14); setTimeout(()=>sfxTone(120,120,'sawtooth',0.14), 70); } // ブー

  } catch (e) {
    const t = document.getElementById('toast');
    if (t) t.textContent = 'ERR: ' + (e && e.message ? e.message : e);
    console.log(e);
  }

})();
</script>
